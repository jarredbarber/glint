name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Assemble deploy root
        run: |
          mkdir -p dist-spa
          cp src/spa/index.html dist-spa/
          cp src/spa/llms.txt dist-spa/
          # Optional client-id config (commit src/spa/config.js to enable Drive/GitHub).
          [ -f src/spa/config.js ] && cp src/spa/config.js dist-spa/ || true
          cp -r assets dist-spa/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-spa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
