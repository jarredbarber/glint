<!DOCTYPE html>
<!--
  PROTOTYPE — Drive SPA spike (issue #19). THROWAWAY, not production.
  Question it answers: can a static, server-less page do Google OAuth from a
  static origin and round-trip a .md file to Drive (read -> edit -> save)?

  Rendering is deliberately NOT tested here (a textarea, not Glint's pipeline) —
  in-browser rendering was already proven by the #14 browser bundle. This spike
  isolates the OAuth + Drive risk the user flagged.

  RUN:  cd spike && python3 -m http.server 8000   then open http://localhost:8000/drive-spa.html
  (OAuth will NOT work from file:// — GIS needs a real authorized JS origin.)

  SETUP (one-time, human, in Google Cloud Console):
    1. Create/select a project. APIs & Services -> Library -> enable "Google Drive API".
    2. OAuth consent screen: External, add yourself as a Test user.
    3. Credentials -> Create -> OAuth client ID -> Web application.
       Authorized JavaScript origins: http://localhost:8000
    4. Copy the Client ID, paste it into the field below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drive SPA spike</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
  header { background: #fef3c7; border: 1px solid #f59e0b; padding: .5rem .75rem; border-radius: 6px; font-size: 13px; }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
  input, select, textarea, button { font: inherit; }
  input[type=text] { width: 100%; padding: .4rem; box-sizing: border-box; }
  textarea { width: 100%; height: 300px; padding: .5rem; box-sizing: border-box; font-family: ui-monospace, monospace; }
  button { padding: .4rem .8rem; margin: .25rem .25rem 0 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #log { background: #111; color: #0f0; font-family: ui-monospace, monospace; font-size: 12px;
         padding: .75rem; border-radius: 6px; height: 180px; overflow: auto; white-space: pre-wrap; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>⚠️ PROTOTYPE — Drive SPA spike (#19). Throwaway. Serve from http://localhost:8000, not file://.</header>

<label>1. OAuth Client ID <small>(saved in localStorage, not a secret)</small></label>
<input type="text" id="clientId" placeholder="xxxxx.apps.googleusercontent.com">

<div class="row">
  <button id="signin">2. Sign in with Google</button>
  <span id="authState">not signed in</span>
</div>

<label>3. Pick a Markdown file</label>
<div class="row">
  <button id="list" disabled>List my .md files</button>
  <select id="files" disabled><option>—</option></select>
  <button id="open" disabled>Open</button>
</div>

<label>4. Edit &amp; save <span id="fileMeta"></span></label>
<textarea id="content" placeholder="file contents load here" disabled></textarea>
<div class="row">
  <button id="save" disabled>Save to Drive</button>
  <button id="reload" disabled>Reload from Drive (prove persistence)</button>
</div>

<label>State log</label>
<div id="log"></div>

<script>
// --- state (in memory only; skill rule 3: no persistence except the file itself) ---
let accessToken = null;
let tokenClient = null;
let currentFileId = null;
let loadedModifiedTime = null; // optimistic-lock probe

const $ = id => document.getElementById(id);
const log = (msg) => { $('log').textContent += msg + '\n'; $('log').scrollTop = 1e9; };
const dump = () => log(`  state: token=${accessToken ? 'yes' : 'no'} fileId=${currentFileId} loadedMTime=${loadedModifiedTime}`);

const SCOPE = 'https://www.googleapis.com/auth/drive'; // spike: broad. Production -> drive.file + Picker.

// restore client id
$('clientId').value = localStorage.getItem('spike-client-id') || '';
$('clientId').addEventListener('change', e => localStorage.setItem('spike-client-id', e.target.value.trim()));

$('signin').addEventListener('click', () => {
  const clientId = $('clientId').value.trim();
  if (!clientId) { log('ERROR: paste an OAuth Client ID first.'); return; }
  if (!window.google?.accounts?.oauth2) { log('ERROR: GIS not loaded yet, wait a sec and retry.'); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId, scope: SCOPE,
    callback: (resp) => {
      if (resp.error) { log('AUTH ERROR: ' + resp.error); return; }
      accessToken = resp.access_token;
      $('authState').textContent = 'signed in ✓';
      ['list'].forEach(id => $(id).disabled = false);
      log('AUTH ok, got access token.'); dump();
    }
  });
  log('requesting token (popup)...');
  tokenClient.requestAccessToken();
});

async function drive(path, opts = {}) {
  const res = await fetch('https://www.googleapis.com' + path, {
    ...opts, headers: { Authorization: 'Bearer ' + accessToken, ...(opts.headers || {}) }
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res;
}

$('list').addEventListener('click', async () => {
  try {
    log('listing .md files...');
    const q = encodeURIComponent("name contains '.md' and trashed = false");
    const res = await drive(`/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&pageSize=50&orderBy=modifiedTime desc`);
    const { files } = await res.json();
    const sel = $('files'); sel.innerHTML = '';
    files.forEach(f => { const o = document.createElement('option'); o.value = f.id; o.textContent = f.name; sel.appendChild(o); });
    sel.disabled = false; $('open').disabled = files.length === 0;
    log(`found ${files.length} file(s).`);
  } catch (e) { log('LIST ERROR: ' + e.message); }
});

$('open').addEventListener('click', () => loadFile($('files').value));
$('reload').addEventListener('click', () => loadFile(currentFileId));

async function loadFile(fileId) {
  try {
    log(`reading file ${fileId}...`);
    const meta = await (await drive(`/drive/v3/files/${fileId}?fields=name,modifiedTime`)).json();
    const text = await (await drive(`/drive/v3/files/${fileId}?alt=media`)).text();
    currentFileId = fileId; loadedModifiedTime = meta.modifiedTime;
    $('content').value = text; $('content').disabled = false;
    ['save', 'reload'].forEach(id => $(id).disabled = false);
    $('fileMeta').textContent = `— ${meta.name} (modified ${meta.modifiedTime})`;
    log(`read ${text.length} chars.`); dump();
  } catch (e) { log('READ ERROR: ' + e.message); }
}

$('save').addEventListener('click', async () => {
  try {
    // optimistic-lock probe: re-check modifiedTime before overwriting
    const fresh = await (await drive(`/drive/v3/files/${currentFileId}?fields=modifiedTime`)).json();
    if (fresh.modifiedTime !== loadedModifiedTime) {
      if (!confirm('File changed on Drive since you opened it. Overwrite anyway?')) { log('save cancelled (conflict).'); return; }
    }
    log('saving (PATCH uploadType=media)...');
    const res = await drive(`/upload/drive/v3/files/${currentFileId}?uploadType=media&fields=modifiedTime`, {
      method: 'PATCH', headers: { 'Content-Type': 'text/markdown' }, body: $('content').value
    });
    const out = await res.json();
    loadedModifiedTime = out.modifiedTime;
    log(`SAVED ✓ new modifiedTime=${out.modifiedTime}`); dump();
  } catch (e) { log('SAVE ERROR: ' + e.message); }
});

log('ready. Steps: paste Client ID -> Sign in -> List -> Open -> edit -> Save -> Reload.');
</script>
</body>
</html>
