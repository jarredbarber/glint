<!doctype html>
<html data-theme="reader">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://apis.google.com https://content.googleapis.com https://www.googleapis.com https://api.github.com https://glint-github-oauth.hector-ea.workers.dev; frame-src 'self' https://accounts.google.com https://docs.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Glint</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Glint">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="./assets/layout.css">
  <link rel="stylesheet" href="./assets/highlight.css">
  <link id="glint-color-scheme" rel="stylesheet" href="./assets/color-schemes/nord.css">
  <link rel="stylesheet" href="./assets/themes.css">
  <link rel="stylesheet" href="./assets/katex/katex.min.css">
  <link rel="stylesheet" href="./assets/fonts.css">
</head>
<body>
  <button class="mobile-toggle" type="button" aria-label="Open page navigation" aria-expanded="false">☰</button>
  <nav class="sidebar" aria-label="Pages"></nav>
  <div class="mobile-overlay" aria-hidden="true"></div>
  <main class="content">
    <div class="glint-content-bar" hidden></div>
    <div class="glint-content-body">
      <div class="content-wrapper"></div>
      <aside class="glint-comment-rail" aria-label="Comments" hidden></aside>
    </div>
  </main>
  <!-- Optional: sets window.GLINT_CONFIG with public backend credentials.
       Absent on the fake/local backends; a 404 here is harmless. See config.example.js. -->
  <script src="./config.js"></script>
  <script src="./assets/glint-render.bundle.js"></script>
  <script src="./assets/editor.bundle.js"></script>
  <script type="module" src="./assets/spa.bundle.js"></script>
</body>
</html>
